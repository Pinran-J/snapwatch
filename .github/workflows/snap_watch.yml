name: Snap Watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = run the real fare search; test-notify = just send a test ping"
        type: choice
        options: [check, test-notify]
        default: check

concurrency:
  group: snap-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ "${{ inputs.mode }}" != "test-notify" ]; then
            playwright install --with-deps chromium
          fi

      - name: Run watcher
        env:
          SNAP_NOTIFIER: telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.mode }}" = "test-notify" ]; then
            python snap_watch.py --test-notify
          else
            python snap_watch.py --once
          fi

      - name: Commit updated state
        if: inputs.mode != 'test-notify'
        run: |
          git config user.name "snap-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snap_state.json
          git diff --cached --quiet || git commit -m "Update snap_state.json [skip ci]"
          git push
